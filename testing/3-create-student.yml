info:
  name: Create Student
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/students
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Kavitha Raman",
        "email": "kavitha.raman@example.com",
        "department": "Computer Science",
        "yearOfStudy": 2,
        "phoneNumber": "9840123456"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

