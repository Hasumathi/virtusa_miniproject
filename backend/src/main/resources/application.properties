# ===================================================================
# Team 8 - Student Management Dashboard
# Database, Entity and Repository Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=student-management-backend

# -------------------------------------------------------------------
# MySQL Database Connectivity Configuration
# -------------------------------------------------------------------
# Connects to MySQL on standard port 3306.
# 'createDatabaseIfNotExist=true' automatically creates the database if it doesn't already exist.
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
# 'update': Automatically updates the schema without destroying existing data.
# Options: 'update', 'create-drop' (for dev testing), 'validate' (production)
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Database Dialect is auto-detected by Hibernate 6 based on JDBC Connection
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Print and format generated SQL queries to console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open EntityManager in View
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.virtusa.studentmanagement=INFO
