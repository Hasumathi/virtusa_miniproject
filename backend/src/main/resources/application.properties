# ===================================================================
# Team 8 - Student Management Dashboard
# Database, Entity and Repository Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=student-management-backend

# Swagger UI & OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# -------------------------------------------------------------------
# Neon PostgreSQL Database Connectivity Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://ep-wispy-term-az0teq12-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_MvSP71Lbipfj
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
# 'update': Automatically updates the schema without destroying existing data.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Print and format generated SQL queries to console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open EntityManager in View
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.virtusa.studentmanagement=INFO

# -------------------------------------------------------------------
# Spring Boot Actuator Configuration
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Student Management System
info.app.description=Team 8 Mini Project Backend
info.app.version=1.0.0

